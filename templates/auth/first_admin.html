<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Create administrator - File Analysis System</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logos/logo_347c1538.png') }}">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='icons/bootstrap-icons.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='fonts/inter.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/auth-workspace.css') }}" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="card admin-card">
        <div class="card-body p-4">
            <div class="head-icon"><i class="bi bi-person-workspace"></i></div>
            <h4 class="text-center">Create the administrator account</h4>
            <p class="head-sub text-center">
                <i class="bi bi-info-circle"></i>
                <span>This page is available only until the first administrator exists.</span>
            </p>
            <div id="err" class="admin-error" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i><span id="err-msg"></span>
            </div>
            <form id="form" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field">
                    <label class="field-label" for="username"><i class="bi bi-person-badge"></i> Admin username <span class="req">*</span></label>
                    <div class="field-control">
                        <span class="field-icon"><i class="bi bi-person-vcard"></i></span>
                        <input class="form-control" id="username" name="username" required maxlength="64"
                               autocomplete="username" placeholder="e.g. admin">
                    </div>
                </div>
                <div class="field">
                    <label class="field-label" for="password"><i class="bi bi-key-fill"></i> Password <span class="req">*</span></label>
                    <div class="field-control">
                        <span class="field-icon"><i class="bi bi-lock-fill"></i></span>
                        <input class="form-control" id="password" name="password" type="password" required
                               minlength="12" autocomplete="new-password" placeholder="Minimum 12 characters">
                        <span class="field-trail">
                            <button type="button" class="pw-toggle" data-target="password" aria-label="Show password" tabindex="-1"><i class="bi bi-eye"></i></button>
                        </span>
                    </div>
                    <div class="pw-bar" aria-hidden="true"><div class="pw-bar-fill" id="pw-strength"></div></div>
                    <div class="form-text" id="pw-hint"><i class="bi bi-shield-lock"></i> Minimum 12 characters.</div>
                </div>
                <div class="field">
                    <label class="field-label" for="password2"><i class="bi bi-key"></i> Confirm password <span class="req">*</span></label>
                    <div class="field-control">
                        <span class="field-icon"><i class="bi bi-lock"></i></span>
                        <input class="form-control" id="password2" type="password" required minlength="12"
                               autocomplete="new-password" placeholder="Re-enter password">
                        <span class="field-trail">
                            <button type="button" class="pw-toggle" data-target="password2" aria-label="Show password" tabindex="-1"><i class="bi bi-eye"></i></button>
                        </span>
                    </div>
                </div>
                <button class="btn-create" id="btn" type="submit">
                    <i class="bi bi-person-check-fill"></i> Create administrator
                </button>
            </form>
        </div>
    </div>
</div>
<p class="page-footnote"><i class="bi bi-hdd-stack"></i> File Analysis System</p>
<script>
(function () {
    var form = document.getElementById('form');
    var errBox = document.getElementById('err');

    function showError(msg) {
        document.getElementById('err-msg').textContent = msg;
        errBox.classList.add('show');
    }

    // Password visibility toggles (presentation only)
    document.querySelectorAll('.pw-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.dataset.target);
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    });

    // Password strength indicator (presentation only)
    document.getElementById('password').addEventListener('input', function () {
        var pw = this.value;
        var score = 0;
        if (pw.length >= 12) score++;
        if (pw.length >= 16) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        var pct = Math.min(100, score * 20);
        var colors = ['#ef4444', '#f59e0b', '#f59e0b', '#10b981', '#10b981', '#10b981'];
        var bar = document.getElementById('pw-strength');
        bar.style.width = pct + '%';
        bar.style.background = colors[score] || '#e2e8f0';
        var hint = document.getElementById('pw-hint');
        var label = pw.length === 0 ? 'Minimum 12 characters.' :
                    score < 2 ? 'Weak password' : score < 4 ? 'Fair password' : 'Strong password';
        var icon = pw.length === 0 ? 'bi-shield-lock' :
                   score < 2 ? 'bi-shield-exclamation' : score < 4 ? 'bi-shield-plus' : 'bi-shield-check';
        hint.innerHTML = '<i class="bi ' + icon + '"></i> ' + label;
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        errBox.classList.remove('show');
        var btn = document.getElementById('btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-arrow-repeat icon-spin"></i> Creating…';
        var p1 = document.getElementById('password').value;
        var p2 = document.getElementById('password2').value;
        if (p1 !== p2) {
            showError('Passwords do not match');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-person-check-fill"></i> Create administrator';
            return;
        }
        fetch(window.location.href, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('meta[name=csrf-token]').content
            },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: p1
            })
        }).then(function (r) { return r.json().then(function (j) { return {ok: r.ok, body: j}; }); })
          .then(function (res) {
            if (res.ok) { window.location.href = res.body.redirect || '/'; return; }
            showError(res.body.error || 'Failed to create administrator');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-person-check-fill"></i> Create administrator';
        }).catch(function () {
            showError('An internal error occurred.');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-person-check-fill"></i> Create administrator';
        });
    });
})();
</script>
</body>
</html>
